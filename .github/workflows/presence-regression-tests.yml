name: Presence Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  presence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Run presence regression tests
        run: npm test --workspace server
      - name: Verify server syntax
        run: npm run build --workspace server
